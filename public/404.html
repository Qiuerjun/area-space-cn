<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AREA-SPACE-CN</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
    // GitHub Pages 404 路由重定向到首页，支持 HashRouter
    location.href =
      location.protocol +
      "//" +
      location.hostname +
      (location.port ? ":" + location.port : "") +
      "/#" +
      location.pathname +
      location.search;
  </script>
  </head>
  <body></body>
</html>
